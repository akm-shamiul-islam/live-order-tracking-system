<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍳</text></svg>"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#f8fafc" />
    <title>KitchenToDoor | Fresh Food & Live Order Tracking</title>
    <meta
      name="description"
      content="Explore burgers, sourdough pizzas, pasta, fresh salads and desserts. Order from KitchenToDoor and follow every kitchen and delivery update."
    />
    <link rel="stylesheet" href="/initial-loader.css" />
    <link
      rel="preload"
      href="/fonts/inter-latin-3100e775.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/outfit-latin-6c18d579.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- theme-init -->
  </head>
  <body
    class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen font-sans antialiased selection:bg-teal-500/30 selection:text-teal-600 transition-colors duration-200"
  >
    <div id="root">
      <div class="initial-loader" role="status" aria-live="polite" aria-atomic="true">
        <div class="initial-loader__card">
          <span class="initial-loader__mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M4 11h16l-1.4 9H5.4L4 11Z" />
              <path d="M6 11V8a6 6 0 0 1 12 0v3M2.5 11h19M8 3 6.8 1.8M16 3l1.2-1.2" />
            </svg>
          </span>
          <p class="initial-loader__brand">KitchenToDoor</p>
          <span class="initial-loader__spinner" aria-hidden="true"></span>
          <p class="initial-loader__message">
            <span class="initial-loader__en" lang="en">Preparing your menu…</span>
            <span class="initial-loader__ja" lang="ja">メニューを準備しています…</span>
          </p>
        </div>
      </div>
    </div>
    <noscript
      >Enable JavaScript to browse the menu, place an order, and follow live updates.</noscript
    >
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
